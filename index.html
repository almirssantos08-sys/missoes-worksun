<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missões Worksun</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#142231">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, like a driver app. Hero balance on top, then tabs. Single dark Worksun theme. */
:root {
  --navy: #142231;
  --raised: #1D3144;
  --raised-2: #26405A;
  --line: #2E4A64;
  --lime: #B8E14E;
  --ink: #F4F1F4;
  --muted: #9FB0BF;
  --good: #7DD8A2;
  --warn: #F2B544;
  --bad: #F28B82;
  --font: 'Poppins', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--navy); color: var(--ink); font-family: var(--font); }
body { min-height: 100%; }
button, select, input { font-family: inherit; }
.wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.brand .dot { color: var(--lime); }
.brand small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.periods { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--lime); color: var(--navy); border-color: var(--lime); font-weight: 600; }
.chip:focus-visible, .tab:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.who { display: flex; align-items: center; gap: 12px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--raised-2); display: grid; place-items: center; font-weight: 700; color: var(--lime); flex: none; }
.who .name { font-size: 18px; font-weight: 600; }
.who .team { font-size: 13px; color: var(--muted); }
.who select { margin-left: auto; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.hero { background: var(--raised); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; border-top: 6px solid var(--lime); }
.hero .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
.hero .money { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .money.zero { color: var(--muted); }
.hero .sub { font-size: 14px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.pill.super { background: var(--lime); color: var(--navy); }
.pill.meta { background: rgba(125,216,162,.18); color: var(--good); }
.pill.rumo { background: rgba(242,181,68,.16); color: var(--warn); }
.pill.pago { background: rgba(159,176,191,.18); color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.track { position: relative; height: 14px; background: var(--navy); border-radius: 999px; margin-top: 18px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--lime); }
.mark { position: absolute; top: -18px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.mark::after { content: ""; position: absolute; left: 50%; top: 16px; width: 2px; height: 22px; background: var(--ink); opacity: .7; }
.mark.below { top: 20px; }
.mark.below::after { top: -22px; height: 20px; }
.hero .track { margin-bottom: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--navy); border-radius: 10px; padding: 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.next { font-size: 14px; background: var(--navy); border-radius: 10px; padding: 10px 12px; }
.next b { color: var(--lime); }
.toast { display: flex; gap: 12px; align-items: center; background: var(--raised-2); border-radius: 12px; padding: 12px 14px; border-left: 4px solid var(--lime); }
.toast .t1 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.toast .t2 { font-size: 15px; font-weight: 600; }
.tabs { display: flex; gap: 4px; background: var(--raised); border-radius: 12px; padding: 4px; overflow-x: auto; }
.tab { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 9px 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--navy); color: var(--ink); }
.tab .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--warn); color: var(--navy); font-size: 11px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; background: var(--raised); border-radius: 12px; padding: 12px; }
.ico { width: 40px; height: 40px; border-radius: 10px; background: var(--navy); display: grid; place-items: center; color: var(--lime); }
.ico svg { width: 22px; height: 22px; }
.item .c { font-size: 15px; font-weight: 600; line-height: 1.3; }
.item .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 6px; background: var(--navy); color: var(--muted); }
.tag.ok { color: var(--good); }
.tag.no { color: var(--bad); }
.tag.wa { color: var(--warn); }
.right { text-align: right; }
.right .p { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.right .p.neg { color: var(--bad); }
.right .e { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.right .e.rs { color: var(--lime); font-weight: 600; }
.right .e.meta { color: var(--navy); background: var(--lime); border-radius: 6px; padding: 1px 6px; font-weight: 700; }
.rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; background: var(--raised); border-radius: 12px; padding: 12px; }
.rank.me { outline: 2px solid var(--lime); }
.rank .pos { font-weight: 700; color: var(--muted); text-align: center; }
.rank .bar { height: 6px; background: var(--navy); border-radius: 999px; margin-top: 6px; position: relative; overflow: hidden; }
.rank .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); border-radius: 999px; }
.rank .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
.card { background: var(--raised); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 15px; }
.card ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .gain { font-size: 13px; color: var(--lime); font-weight: 600; }
.card a { color: var(--lime); font-size: 13px; }
.helmets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.helmet { background: var(--raised); border-radius: 12px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; opacity: .55; }
.helmet.on { opacity: 1; outline: 2px solid var(--lime); }
.helmet svg { width: 40px; height: 40px; }
.helmet b { font-size: 14px; }
.helmet span { font-size: 12px; color: var(--muted); }
table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
table.hist th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.hist td { padding: 9px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.hist td.n, table.hist th.n { text-align: right; }
.histwrap { overflow-x: auto; background: var(--raised); border-radius: 12px; padding: 4px 8px; }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 12px; background: var(--raised); border-radius: 12px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.btn { border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--lime); color: var(--navy); }
.btn.saque { display: block; text-align: center; text-decoration: none; padding: 14px; font-size: 16px; border-radius: 12px; }
.btn.saque:disabled { background: var(--navy); color: var(--muted); border: 1px dashed var(--line); cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.picker .btn { padding: 14px; font-size: 15px; }
.admin-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; background: var(--navy); border-radius: 10px; padding: 10px; }
.admin-row input { background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; min-width: 0; flex: 1; }
.hits { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.rules { font-size: 13px; color: var(--muted); line-height: 1.7; }
.rules b { color: var(--ink); }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .hero .money { font-size: 36px; } .stats { grid-template-columns: repeat(3, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .fill, .rank .bar i { transition: width .6s ease-out; } }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top"><div class="brand">worksun<span class="dot">.</span><small>Missões</small></div></div>
  <div class="empty" id="boot">Carregando suas missões…</div>
</main>
<script>
(function () {
  const app = document.getElementById('app');
  const S = { db: null, user: null, myId: null, isOwner: false, pessoas: {}, periodos: {}, missoes: [], hist: {}, pend: [], sync: null, got: {}, timedOut: false,
    view: { periodo: null, pessoa: null, tab: 'missoes' }, adminQ: {}, adminHits: {} };
  const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  S.view.tab = LS.get('ms_tab') || 'missoes';

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const dm = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m; };
  const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
  const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  const ICONS = {
    instalacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 15l3-9h12l3 9z"/><path d="M8.5 6L7 15M15.5 6L17 15M4.5 10.5h15"/><path d="M12 15v4M8 19h8"/></svg>',
    manutencao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8 7.2 20l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
    padrao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M12 16v2"/></svg>',
    eletrico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
    remocao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
    remanejo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>'
  };
  const TIPO = { instalacao: 'Instalação', manutencao: 'Manutenção', padrao: 'Padrão de entrada', eletrico: 'Serviço elétrico', remocao: 'Remoção', remanejo: 'Remanejo' };
  const HELMET = c => `<svg viewBox="0 0 48 48"><path d="M8 32a16 16 0 0 1 32 0z" fill="${c}"/><rect x="5" y="31" width="38" height="6" rx="3" fill="${c}"/><path d="M24 16v10" stroke="#142231" stroke-width="3"/></svg>`;

  function periodsSorted() { return Object.values(S.periodos).sort((a, b) => a.inicio < b.inicio ? -1 : 1); }
  function currentPeriodId() {
    const t = today(); const ps = periodsSorted();
    const open = ps.find(p => t >= p.inicio && t <= p.fim) || ps.filter(p => !p.fechado).pop() || ps[ps.length - 1];
    return open ? open.id : null;
  }

  function calc(pid, slug) {
    const per = S.periodos[pid]; const m = per && per.metas ? per.metas[slug] : null;
    const ms = S.missoes.filter(x => x.periodo === pid && (x.pessoas || []).includes(slug))
      .sort((a, b) => (a.data + (a.ordem || '') + a.cliente) < (b.data + (b.ordem || '') + b.cliente) ? -1 : 1);
    let cum = 0;
    const rows = ms.map(x => {
      const pts = Number(x.ptsPorPessoa && x.ptsPorPessoa[slug] != null ? x.ptsPorPessoa[slug] : x.pts) || 0; const before = cum; cum += pts; let ef = { kind: 'none' };
      if (m) {
        if (before < m.meta && cum >= m.meta) ef = { kind: 'meta', v: m.fixo + (cum - m.meta) };
        else if (before >= m.meta) ef = { kind: 'rs', v: pts };
        else ef = { kind: 'rumo', falta: m.meta - cum };
      }
      return Object.assign({}, x, { pts, before, cum, ef });
    });
    const h = S.hist[pid + '_' + slug];
    const fromHist = !!h && (!ms.length || h.oficial);
    const pts = fromHist ? (h.pts || 0) : cum;
    let valor = 0, res = 'abaixo';
    if (fromHist) { valor = h.valor == null ? null : h.valor; res = h.resultado || 'abaixo'; }
    else if (m) { valor = pts >= m.meta ? m.fixo + (pts - m.meta) : 0; res = pts >= m.super ? 'supermeta' : pts >= m.meta ? 'meta' : 'abaixo'; }
    const servicos = ms.length || (fromHist ? (h.servicos || null) : 0);
    return { m, rows, pts, valor, res, servicos, fromHist, hist: h || null, per };
  }

  function streak(slug) {
    const ps = periodsSorted(); const cur = currentPeriodId(); let n = 0; let started = false;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i]; const c = calc(p.id, slug);
      if (p.id === cur && !p.fechado && c.res !== 'supermeta') continue;
      if (!c.m && !c.fromHist) { if (started) break; else continue; }
      if (c.res === 'supermeta') { n++; started = true; } else break;
    }
    return n;
  }

  function resolvePessoa() {
    const ativos = Object.values(S.pessoas).filter(p => p.ativo !== false).sort((a, b) => (a.ordem || 99) - (b.ordem || 99));
    if (S.isOwner) {
      const saved = LS.get('ms_ver'); const ok = id => S.pessoas[id] && S.pessoas[id].ativo !== false;
      return ok(S.view.pessoa) ? S.view.pessoa : (ok(saved) ? saved : (ativos[0] && ativos[0].id));
    }
    const linked = Object.values(S.pessoas).find(p => S.myId && p.uid === S.myId);
    if (linked) return linked.id;
    const hs = (location.hash || '').replace('#', '');
    if (hs && S.pessoas[hs] && S.pessoas[hs].ativo !== false && !S.pessoas[hs].uid) { LS.set('ms_eu', hs); return hs; }
    const saved = LS.get('ms_eu');
    if (saved && S.pessoas[saved] && !S.pessoas[saved].uid) return saved;
    return null;
  }

  function render() {
    if (!S.db && !S.json) return;
    const ready = S.got.pessoas && S.got.periodos && S.got.missoes;
    if (!ready) {
      app.innerHTML = topBar('') + `<div class="empty">${S.timedOut ? 'Não foi possível carregar as missões agora. Verifique sua conexão; a página atualiza sozinha quando voltar.' : 'Carregando suas missões…'}</div>`;
      return;
    }
    if (!Object.keys(S.pessoas).length) { app.innerHTML = topBar('') + `<div class="empty">Ainda não há missões lançadas.</div>`; return; }
    if (!S.view.periodo || !S.periodos[S.view.periodo]) S.view.periodo = currentPeriodId();
    const slug = resolvePessoa(); S.view.pessoa = slug;
    if (!slug) { renderPicker(); return; }
    const pid = S.view.periodo; const per = S.periodos[pid]; const pessoa = S.pessoas[slug];
    const c = calc(pid, slug);
    let h = topBar(periodChips());
    h += whoBlock(pessoa, c);
    h += heroBlock(pessoa, c, per);
    const last = c.rows[c.rows.length - 1];
    if (last && !per.fechado) h += `<div class="toast"><div class="ico">${ICONS[last.tipo] || ICONS.instalacao}</div><div><div class="t1">Última missão concluída</div><div class="t2">${esc(last.cliente)} · ${last.pts >= 0 ? '+' : ''}${last.pts} pts</div></div></div>`;
    const pend = S.pend.filter(p => p.periodo === pid && (p.pessoas || []).includes(slug));
    h += `<div class="tabs" role="tablist">` + [['missoes', 'Missões'], ['ranking', 'Ranking'], ['pendencias', 'Pendências' + (pend.length ? `<span class="n">${pend.length}</span>` : '')], ['capacetes', 'Capacetes']]
      .concat(S.isOwner ? [['admin', 'Admin']] : [])
      .map(([k, l]) => `<button class="tab" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${S.view.tab === k}">${l}</button>`).join('') + `</div>`;
    const tab = S.view.tab === 'admin' && !S.isOwner ? 'missoes' : S.view.tab;
    if (tab === 'missoes') h += missoesBlock(c);
    if (tab === 'ranking') h += rankingBlock(pid, slug);
    if (tab === 'pendencias') h += pendBlock(pend);
    if (tab === 'capacetes') h += capacetesBlock(slug);
    if (tab === 'admin') h += adminBlock(pid);
    h += footer();
    app.innerHTML = h;
    if (tab === 'admin') fillAdminNames();
  }

  function topBar(extra) {
    return `<div class="top"><div class="brand">worksun<span class="dot">.</span><small>Missões</small></div></div>` + (extra || '');
  }
  function periodChips() {
    const cur = currentPeriodId();
    return `<div class="periods" aria-label="Período">` + periodsSorted().filter(p => !p.semDados).slice().reverse().map(p =>
      `<button class="chip" data-periodo="${esc(p.id)}" aria-pressed="${p.id === S.view.periodo}">${esc(p.nome)}${p.id === cur ? ' · atual' : ''}</button>`).join('') + `</div>`;
  }
  function whoBlock(p, c) {
    let sel = '';
    if (S.isOwner) {
      sel = `<label class="note" for="ver" style="margin-left:auto">Ver como</label><select id="ver">` +
        Object.values(S.pessoas).filter(x => x.ativo !== false || x.id === p.id).sort((a, b) => (a.ordem || 99) - (b.ordem || 99)).map(x => `<option value="${esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('') + `</select>`;
    } else if (!p.uid) {
      sel = `<button class="btn ghost" id="trocar" style="margin-left:auto">Não sou ${esc(p.nome)}</button>`;
    }
    const team = c.m ? c.m.equipe : (p.equipe || '');
    return `<div class="who"><div class="avatar">${esc(initials(p.nome))}</div><div><div class="name">${esc(p.nome)}</div><div class="team">${esc(team)}</div></div>${sel}</div>`;
  }
  function heroBlock(p, c, per) {
    const m = c.m; const pago = per.status === 'pago';
    let pill = c.res === 'supermeta' ? '<span class="pill super">Supermeta</span>' : c.res === 'meta' ? '<span class="pill meta">Meta batida</span>' : '<span class="pill rumo">Rumo à meta</span>';
    let lbl = per.fechado ? (pago ? 'Pago em ' + dmy(per.pagamento) : 'Valor final · a receber em ' + dmy(per.pagamento)) : 'Valor final previsto · paga em ' + dmy(per.pagamento);
    let h = `<section class="hero" aria-label="Saldo"><div class="row"><span class="lbl">${esc(lbl)}</span>${pago ? '<span class="pill pago">Pago</span>' : pill}</div>`;
    h += c.valor == null ? `<div class="money zero">${c.pts} pts</div><div class="sub">Período anterior ao app: o valor foi pago fora daqui.</div>` : `<div class="money ${c.valor ? '' : 'zero'}">${brl(c.valor)}</div>`;
    if (m) {
      const max = Math.max(m.super * 1.25, c.pts * 1.05, 1);
      const pct = v => Math.max(0, Math.min(100, v / max * 100));
      h += `<div class="track" aria-label="${c.pts} pontos de ${m.meta} da meta"><div class="fill" style="width:${pct(c.pts)}%"></div><span class="mark" style="left:${pct(m.meta)}%">Meta ${m.meta}</span><span class="mark below" style="left:${pct(m.super)}%">Super ${m.super}</span></div>`;
      h += `<div class="stats"><div class="stat"><b>${c.pts}</b><span>pontos</span></div><div class="stat"><b>${c.servicos == null ? '–' : c.servicos}</b><span>missões</span></div><div class="stat"><b>${c.pts >= m.meta ? '+' + (c.pts - m.meta) : m.meta - c.pts}</b><span>${c.pts >= m.meta ? 'acima da meta' : 'faltam p/ meta'}</span></div></div>`;
      if (!per.fechado) {
        let nx;
        if (c.pts < m.meta) nx = `Faltam <b>${m.meta - c.pts} pts</b> para destravar <b>${brl(m.fixo)}</b>.`;
        else if (c.pts < m.super) nx = `Cada ponto agora vale <b>+${brl(1)}</b>. Faltam <b>${m.super - c.pts} pts</b> para a supermeta, que conta para o capacete.`;
        else nx = `Supermeta garantida. Cada ponto a mais vale <b>+${brl(1)}</b>.`;
        h += `<div class="next">${nx}</div>`;
        const ruins = c.rows.filter(r => r.trello === -6).length;
        if (ruins) {
          const potPts = c.pts + ruins * 9; const potV = potPts >= m.meta ? m.fixo + (potPts - m.meta) : 0;
          h += `<div class="next">Completando o Trello de ${ruins} ${ruins === 1 ? 'cartão' : 'cartões'} você ganha <b>+${ruins * 9} pts</b>${potV > c.valor ? ` e o valor sobe para <b>${brl(potV)}</b>` : `, ficando a ${Math.max(0, m.meta - potPts)} pts da meta`}. Veja a aba Pendências.</div>`;
        }
      }
      if (c.valor != null) h += saqueBlock(p, c, per);
    } else if (c.fromHist) {
      h += `<div class="sub">${c.pts} pontos · ${c.res === 'supermeta' ? 'supermeta' : c.res === 'meta' ? 'meta batida' : 'abaixo da meta'} · histórico da planilha${c.hist && c.hist.fonte === 'calculado' ? ' (total somado pelo app)' : ''}</div>`;
    } else {
      h += `<div class="sub">Sem meta definida para você neste período.</div>`;
    }
    return h + `</section>`;
  }
  function saqueBlock(p, c, per) {
    if (per.status === 'pago') return '';
    const liberado = today() >= per.fim;
    if (!liberado) return `<button class="btn saque" disabled>Sacar dinheiro · libera em ${dmy(per.fim)}</button>`;
    if (!c.valor) return `<div class="note">Meta não batida neste período, sem valor para sacar.</div>`;
    const msg = `Olá Almir! Quero sacar meu bônus de ${per.nome}: ${brl(c.valor)} (${c.pts} pontos). Enviado pelo app Missões Worksun.`;
    return `<a class="btn saque" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Sacar dinheiro · ${brl(c.valor)}</a><div class="note">Abre o WhatsApp com o pedido pronto para enviar ao Almir. Pagamento previsto em ${dmy(per.pagamento)}.</div>`;
  }
  function missoesBlock(c) {
    if (c.fromHist && !c.rows.length) return `<div class="empty">Este período foi fechado antes do app. Só o total de pontos foi registrado.</div>`;
    if (!c.rows.length) return `<div class="empty">Nenhuma missão concluída ainda neste período. Assim que um cartão for para Missões concluídas no Trello, ele aparece aqui.</div>`;
    return `<div class="list">` + c.rows.slice().reverse().map(r => {
      const tags = [];
      if (r.trello === 3) tags.push('<span class="tag ok">Trello completo +3</span>');
      if (r.trello === -6) tags.push('<span class="tag no">Trello incompleto −6</span>');
      if (r.fonte === 'WhatsApp') tags.push('<span class="tag wa">Pelo WhatsApp</span>');
      if (r.fonte === 'Planilha') tags.push('<span class="tag">Planilha</span>');
      if (r.status === 'analise') tags.push('<span class="tag wa">Em análise</span>');
      (r.extras || []).forEach(t => tags.push(`<span class="tag">${esc(t)}</span>`));
      let e = '';
      if (r.ef.kind === 'meta') e = `<div class="e meta">Meta batida · ${brl(r.ef.v)}</div>`;
      else if (r.ef.kind === 'rs') e = `<div class="e rs">${r.pts >= 0 ? '+' : '−'}${brl(Math.abs(r.ef.v))}</div>`;
      else if (r.ef.kind === 'rumo') e = `<div class="e">faltam ${r.ef.falta}</div>`;
      return `<div class="item"><div class="ico">${ICONS[r.tipo] || ICONS.instalacao}</div><div><div class="c">${esc(r.cliente)}</div><div class="d">${r.semData ? '' : dm(r.data) + ' · '}${esc(TIPO[r.tipo] || r.tipo)}${r.detalhe && r.detalhe !== (TIPO[r.tipo] || '') ? ' · ' + esc(r.detalhe) : ''}</div>${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div><div class="right"><div class="p ${r.pts < 0 ? 'neg' : ''}">${r.pts >= 0 ? '+' : ''}${r.pts}</div>${e}</div></div>`;
    }).join('') + `</div>`;
  }
  function rankingBlock(pid, slug) {
    const per = S.periodos[pid];
    const ids = Object.keys(S.pessoas).filter(s => (per.metas && per.metas[s]) || S.hist[pid + '_' + s]);
    const rs = ids.map(s => ({ s, c: calc(pid, s) })).filter(x => x.c.pts > 0 || x.c.m).sort((a, b) => b.c.pts - a.c.pts);
    if (!rs.length) return `<div class="empty">Sem pontos neste período ainda.</div>`;
    const max = Math.max(...rs.map(x => x.c.pts), 1);
    return `<div class="list">` + rs.map((x, i) => {
      const p = S.pessoas[x.s]; const sup = x.c.res === 'supermeta' ? ' <span class="pill super">Super</span>' : x.c.res === 'meta' ? ' <span class="pill meta">Meta</span>' : '';
      return `<div class="rank ${x.s === slug ? 'me' : ''}"><div class="pos">${i + 1}º</div><div><div>${esc(p.nome)}${sup}</div><div class="bar"><i style="width:${x.c.pts / max * 100}%"></i></div></div><div class="pts">${x.c.pts}</div></div>`;
    }).join('') + `</div><p class="note">O ranking mostra só os pontos. O valor em reais de cada um aparece apenas para a própria pessoa.</p>`;
  }
  function pendBlock(pend) {
    if (!pend.length) return `<div class="empty">Nenhuma pendência nos seus cartões. Cartão completo vale +3 em cada missão.</div>`;
    return `<div class="list">` + pend.map(p => `<div class="card"><h3>${esc(p.cliente)}</h3><ul>${(p.falta || []).map(f => `<li>${esc(f)}</li>`).join('')}</ul>${p.ganho ? `<div class="gain">Completando o cartão: +${esc(p.ganho)} pts</div>` : ''}${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir no Trello</a>` : ''}</div>`).join('') + `</div><p class="note">As pendências são conferidas no Trello de hora em hora. Corrigiu o cartão? Ele sai desta lista na próxima atualização.</p>`;
  }
  function capacetesBlock(slug) {
    const n = streak(slug);
    const tiers = [['Bronze', 2, '+25%', '#C98A4B'], ['Prata', 4, '+30%', '#C9D3DB'], ['Ouro', 6, '+35%', '#E9C24A']];
    const next = tiers.find(t => n < t[1]);
    let h = `<div class="card"><h3>${n} ${n === 1 ? 'mês' : 'meses'} seguidos de supermeta</h3><div class="note">${next ? `Faltam ${next[1] - n} para o Capacete de ${next[0]}.` : 'Você chegou ao Capacete de Ouro.'} A sequência zera no mês em que a supermeta não vier.</div></div>`;
    h += `<div class="helmets">` + tiers.map(t => `<div class="helmet ${n >= t[1] ? 'on' : ''}">${HELMET(t[3])}<b>${t[0]}</b><span>${t[1]} meses · ${t[2]}</span></div>`).join('') + `</div>`;
    const ps = periodsSorted().slice().reverse();
    h += `<div class="histwrap"><table class="hist"><thead><tr><th>Período</th><th class="n">Pontos</th><th>Resultado</th><th class="n">Valor</th></tr></thead><tbody>` +
      ps.map(p => { const c = calc(p.id, slug); if (!c.m && !c.fromHist) return ''; const r = c.res === 'supermeta' ? 'Supermeta' : c.res === 'meta' ? 'Meta' : '–';
        return `<tr><td>${esc(p.nome)}${!p.fechado ? ' (em andamento)' : ''}</td><td class="n">${c.pts}</td><td>${r}</td><td class="n">${c.valor ? brl(c.valor) : '–'}</td></tr>`; }).join('') + `</tbody></table></div>`;
    return h;
  }
  function adminBlock(pid) {
    const per = S.periodos[pid];
    let h = `<div class="card"><h3>Período ${esc(per.nome)}</h3><div class="note">${dmy(per.inicio)} a ${dmy(per.fim)} · pagamento ${dmy(per.pagamento)} · ${per.status === 'pago' ? 'pago' : per.fechado ? 'fechado, a pagar' : 'em andamento'}</div>` +
      (per.fechado ? `<div><button class="btn ${per.status === 'pago' ? 'ghost' : ''}" id="pago">${per.status === 'pago' ? 'Desmarcar pagamento' : 'Marcar como pago'}</button></div>` : '') + `</div>`;
    h += `<div class="card"><h3>Acesso do time</h3><div class="note">Vincule cada pessoa à conta dela. Pessoa vinculada vê só o próprio extrato e ninguém mais consegue escolher o nome dela.</div>`;
    Object.values(S.pessoas).filter(p => p.ativo !== false).sort((a, b) => (a.ordem || 99) - (b.ordem || 99)).forEach(p => {
      h += `<div class="admin-row"><div><b>${esc(p.nome)}</b> <span class="note" data-uidname="${esc(p.uid || '')}">${p.uid ? 'vinculado' : 'sem vínculo'}</span></div>` +
        (p.uid ? `<button class="btn ghost" data-unlink="${esc(p.id)}">Desvincular</button>` :
          `<input id="q-${esc(p.id)}" data-q="${esc(p.id)}" placeholder="Buscar conta pelo nome" value="${esc(S.adminQ[p.id] || '')}"><div class="hits" id="hits-${esc(p.id)}"></div>`) + `</div>`;
    });
    h += `<div class="note">A busca encontra pessoas da sua organização. Quem entra como convidado de fora pode escolher o próprio nome na primeira vez que abrir.</div></div>`;
    const base = location.hostname.endsWith('claude.ai') || location.hostname.includes('claude') ? 'https://claude.ai/artifact/L1emgq2Fuv1UZ6VYkpiCuE' : location.origin + location.pathname;
    h += `<div class="card"><h3>Link de cada instalador</h3><div class="note">Mande para cada um o próprio link. Abre direto no saldo dele, sem precisar de conta.</div>` +
      Object.values(S.pessoas).filter(p => p.ativo !== false).sort((a, b) => (a.ordem || 99) - (b.ordem || 99)).map(p => `<div class="admin-row"><div><b>${esc(p.nome)}</b><div class="note">${esc(base)}#${esc(p.id)}</div></div><button class="btn ghost" data-copy="${esc(base + '#' + p.id)}">Copiar link</button></div>`).join('') + `</div>`;
    return h;
  }
  async function fillAdminNames() {
    if (!S.user) return;
    const els = [...app.querySelectorAll('[data-uidname]')].filter(e => e.dataset.uidname);
    if (!els.length) return;
    const ps = await S.user.profiles(els.map(e => e.dataset.uidname));
    els.forEach(e => { const n = ps[e.dataset.uidname] && ps[e.dataset.uidname].name; e.textContent = n ? 'vinculado a ' + n : 'vinculado'; });
  }
  function renderPicker() {
    const livres = Object.values(S.pessoas).filter(p => p.ativo !== false && !p.uid).sort((a, b) => (a.ordem || 99) - (b.ordem || 99));
    app.innerHTML = topBar('') + `<section class="hero"><span class="lbl">Bem-vindo</span><div style="font-size:22px;font-weight:700">Quem é você?</div><div class="sub">Escolha seu nome uma vez. Depois o app abre direto no seu saldo.</div>` +
      (livres.length ? `<div class="picker">${livres.map(p => `<button class="btn" data-eu="${esc(p.id)}">${esc(p.nome)}</button>`).join('')}</div>` : `<div class="sub">Seu acesso ainda não foi liberado. Peça ao Almir para vincular seu nome.</div>`) + `</section>` + footer();
  }
  function footer() {
    const s = S.sync; const when = s && s.em ? new Date(s.em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : null;
    return `<details class="card"><summary>Como os pontos e o valor são calculados</summary><div class="rules">
      <b>Pontos por missão:</b> +1 por módulo (ou placa removida/remanejada), +5 padrão de entrada, +7 manutenção, +7 serviço elétrico de dia todo, +3 de meio-dia, +4 elogio do cliente.<br>
      <b>Trello:</b> cartão completo (checklist e fotos) +3; incompleto −6.<br>
      <b>Valor:</b> bateu a meta, ganha o valor fixo (R$ 160 no time de 3, R$ 106,67 na dupla). Cada ponto acima da meta vale R$ 1.<br>
      <b>Metas:</b> 2 pessoas 120 / supermeta 145 · 3 pessoas 180 / 200 · 4 pessoas 240 / 270.<br>
      <b>Período:</b> do dia 10 ao dia 10, pela data em que o cartão foi para Missões concluídas. Pagamento no dia 15.<br>
      <b>Capacetes:</b> Bronze com 2 meses seguidos de supermeta, Prata com 4, Ouro com 6.</div></details>
      <p class="note">${when ? 'Atualizado do Trello em ' + esc(when) + '.' : ''} Faltas e férias podem reduzir o valor de forma proporcional no fechamento.</p>`;
  }

  app.addEventListener('click', async ev => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.periodo) { S.view.periodo = t.dataset.periodo; render(); return; }
    if (t.dataset.tab) { S.view.tab = t.dataset.tab; LS.set('ms_tab', t.dataset.tab); render(); return; }
    if (t.dataset.eu) { LS.set('ms_eu', t.dataset.eu); try { history.replaceState(null, '', '#' + t.dataset.eu); } catch (e) {} render(); return; }
    if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = 'Copiado'; } catch (e) { t.textContent = 'Copie o link ao lado'; } return; }
    if (t.id === 'trocar') { LS.set('ms_eu', ''); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} renderPicker(); return; }
    if (t.id === 'pago' && S.isOwner) {
      const per = S.periodos[S.view.periodo]; t.disabled = true;
      try { await S.db.doc('periodos/' + per.id).update({ status: per.status === 'pago' ? 'a pagar' : 'pago' }); } catch (e) { t.textContent = 'Não foi possível salvar'; }
      return;
    }
    if (t.dataset.unlink && S.isOwner) { t.disabled = true; try { await S.db.doc('pessoas/' + t.dataset.unlink).update({ uid: null }); } catch (e) { t.textContent = 'Erro ao salvar'; } return; }
    if (t.dataset.link && S.isOwner) {
      const [slug, uid] = t.dataset.link.split('|'); t.disabled = true;
      try { await S.db.doc('pessoas/' + slug).update({ uid }); S.adminQ[slug] = ''; } catch (e) { t.textContent = 'Erro ao salvar'; }
    }
  });
  app.addEventListener('change', ev => {
    if (ev.target.id === 'ver') { S.view.pessoa = ev.target.value; LS.set('ms_ver', ev.target.value); render(); }
  });
  app.addEventListener('input', async ev => {
    const slug = ev.target.dataset && ev.target.dataset.q; if (!slug || !S.user) return;
    S.adminQ[slug] = ev.target.value;
    const hits = await S.user.search(ev.target.value);
    const box = document.getElementById('hits-' + slug); if (!box) return;
    box.innerHTML = '';
    hits.forEach(hh => { const b = document.createElement('button'); b.className = 'btn ghost'; b.dataset.link = slug + '|' + hh.id; b.textContent = 'Vincular a ' + (hh.name || 'conta'); box.appendChild(b); });
    if (!hits.length && ev.target.value) { const s = document.createElement('span'); s.className = 'note'; s.textContent = 'Ninguém encontrado com esse nome.'; box.appendChild(s); }
  });

  function sub(name, ref, onData) {
    ref.onSnapshot(snap => { onData(snap); S.got[name] = true; render(); }, err => { S.got[name] = true; render(); });
  }

  window.addEventListener('hashchange', () => render());
  (async function init() {
    fetch('dados.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => {
      if (!d || S.db) return;
      S.json = true; S.pessoas = {}; S.periodos = {}; S.hist = {};
      (d.pessoas || []).forEach(x => { S.pessoas[x.id] = x; });
      (d.periodos || []).forEach(x => { S.periodos[x.id] = x; });
      (d.historico || []).forEach(x => { S.hist[x.id] = x; });
      S.missoes = d.missoes || []; S.pend = d.pendencias || []; S.sync = d.sync || null;
      S.got = { pessoas: true, periodos: true, missoes: true, historico: true, pendencias: true, sync: true };
      render();
    }).catch(() => {});
    const db = (window.claude && window.claude.use) ? await window.claude.use('db') : null;
    if (!db) { if (!S.json) setTimeout(() => { if (!S.json) app.innerHTML = topBar('') + `<div class="empty">Não foi possível carregar as missões agora. Tente de novo em instantes.</div>`; }, 8000); return; }
    S.db = db; S.json = false; S.got = {};
    const user = await window.claude.use('user'); S.user = user;
    if (user) { S.isOwner = await user.isOwner(); S.myId = await user.id(); }
    setTimeout(() => { S.timedOut = true; render(); }, 10000);
    sub('pessoas', db.collection('pessoas'), s => { S.pessoas = {}; s.docs.forEach(d => { S.pessoas[d.id] = Object.assign({ id: d.id }, d.data()); }); });
    sub('periodos', db.collection('periodos'), s => { S.periodos = {}; s.docs.forEach(d => { S.periodos[d.id] = Object.assign({ id: d.id }, d.data()); }); });
    sub('missoes', db.collection('missoes'), s => { S.missoes = s.docs.map(d => Object.assign({ id: d.id }, d.data())); });
    sub('historico', db.collection('historico'), s => { S.hist = {}; s.docs.forEach(d => { S.hist[d.id] = d.data(); }); });
    sub('pendencias', db.collection('pendencias'), s => { S.pend = s.docs.map(d => Object.assign({ id: d.id }, d.data())); });
    sub('sync', db.doc('meta/sync'), d => { S.sync = d.exists ? d.data() : null; });
    render();
  })();
})();
</script>
</body>
</html>
